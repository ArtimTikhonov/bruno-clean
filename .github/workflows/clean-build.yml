name: Bruno Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['fork-v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: clean-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            shell: bash
          - platform: windows
            os: windows-latest
            shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify release version and changelog
        run: node scripts/version.cjs check
      - name: Test version management
        run: node --test scripts/tests/version.test.cjs
      - name: Verify announcement isolation
        run: node --test scripts/tests/notifications.test.cjs
      - name: Install dependencies and build shared packages
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: ${{ matrix.shell }}
      - name: Verify localization and data preservation
        run: node --test scripts/tests/localization.test.cjs
      - name: Lint changed JavaScript
        run: >-
          npm run lint --
          packages/bruno-app/src/components/StatusBar/index.js
          packages/bruno-electron/src/ipc/notifications.js
          packages/bruno-electron/src/index.js
          packages/bruno-electron/src/app/menu-template.js
          packages/bruno-electron/src/app/about-bruno.js
          packages/bruno-electron/electron-builder-config.js
          packages/bruno-electron/src/app/localize-menu.js
          packages/bruno-app/src/i18n/index.js
          packages/bruno-app/src/i18n/ui.js
          packages/bruno-app/src/providers/App/index.js
          packages/bruno-app/src/components/Preferences/General/index.js
          packages/bruno-app/src/components/Preferences/Keybindings/index.js
          packages/bruno-app/src/components/ChangelogTab/index.js
          packages/bruno-app/plugins/ui-translations/index.cjs
          packages/bruno-app/src/components/CodeEditor/index.js
          packages/bruno-app/src/components/CollectionApp/index.js
          packages/bruno-app/src/components/CollectionSettings/index.js
          packages/bruno-app/src/components/FolderSettings/index.js
          packages/bruno-app/src/components/Preferences/index.js
          packages/bruno-app/src/components/Preferences/Beta/index.js
          packages/bruno-app/src/components/RequestTabs/CollectionHeader/index.js
          packages/bruno-app/src/components/RequestTabPanel/index.js
          packages/bruno-app/src/components/RequestPane/HttpRequestPane/index.js
          packages/bruno-app/src/components/RequestPane/GraphQLRequestPane/index.js
          packages/bruno-app/src/components/RequestPane/GrpcRequestPane/index.js
          packages/bruno-app/src/components/RequestPane/WSRequestPane/index.js
          packages/bruno-app/src/pages/Bruno/index.js
          packages/bruno-app/src/providers/ReduxStore/index.js
          packages/bruno-app/src/providers/ReduxStore/slices/app.js
          packages/bruno-app/src/providers/ReduxStore/slices/workspaces/actions.js
          packages/bruno-electron/src/store/preferences.js
          packages/bruno-electron/src/app/mock-server/mock-rule-matcher.js
          packages/bruno-electron/src/app/mock-server/sensitive-fields.js
      - name: Build renderer
        run: npm run build:web
      - name: Prepare Electron renderer
        run: node scripts/prepare-clean-electron.cjs
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: npm run dist:linux --workspace=packages/bruno-electron -- --x64 --publish never
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win --workspace=packages/bruno-electron -- --x64 --publish never
      - name: Install desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Smoke test Linux packaged app
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/tests/clean-smoke.cjs
      - name: Install and smoke test Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem packages/bruno-electron/out/*_x64_setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'BrunoCleanInstall'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/currentuser', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:BRUNO_CLEAN_EXECUTABLE = Join-Path $installDir 'bruno.exe'
          if (-not (Test-Path $env:BRUNO_CLEAN_EXECUTABLE)) {
            Get-ChildItem $installDir -ErrorAction SilentlyContinue | Select-Object Name
            throw 'Installed executable is missing'
          }
          node scripts/tests/clean-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload smoke test screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: bruno-clean-smoke-${{ matrix.platform }}
          path: bruno-clean-smoke.png
      - name: Upload app
        uses: actions/upload-artifact@v6
        with:
          name: bruno-clean-app-${{ matrix.platform }}-x64
          path: |
            packages/bruno-electron/out/*.AppImage
            packages/bruno-electron/out/*_setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified builds
    needs: build
    if: startsWith(github.ref, 'refs/tags/fork-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify release tag
        id: version
        run: node scripts/version.cjs check
      - uses: actions/download-artifact@v6
        with:
          pattern: bruno-clean-app-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.AppImage *.exe > SHA256SUMS.txt
      - name: Prepare release notes
        run: node scripts/version.cjs notes > release-notes.md
      - name: Publish Linux and Windows builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          options=()
          if [ "$PRERELEASE" = "true" ]; then
            options+=(--prerelease --latest=false)
          else
            options+=(--latest)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Bruno $RELEASE_VERSION" \
            --notes-file release-notes.md \
            "${options[@]}"
