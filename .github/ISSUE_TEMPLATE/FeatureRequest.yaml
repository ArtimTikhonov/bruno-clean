name: Предложение для форка Bruno
description: Предложить улучшение интерфейса, локализации или работы приложения.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу пользователя и пользу изменения.
        Проверьте [существующие предложения](https://github.com/ArtimTikhonov/bruno-clean/issues).
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое поведение
      description: Пример сценария, ожидаемый результат и возможные альтернативы.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Примеры или макеты
