name: Ошибка в форке Bruno
description: Сообщить о проблеме этой сборки, перевода или установщика.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Это трекер неофициального форка ArtimTikhonov/bruno-clean.
        Проверьте [существующие обращения](https://github.com/ArtimTikhonov/bruno-clean/issues).
        Удалите токены, пароли и персональные данные из примеров и логов.
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: Версия из «О Bruno» и тег релиза; для самостоятельной сборки — commit SHA.
      placeholder: 2.1.0 / v2.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options:
        - Windows x64
        - Linux x64
        - Другая платформа / самостоятельная сборка
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Версия ОС
      placeholder: Windows 11 / Ubuntu 24.04, Wayland
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Язык интерфейса
      options:
        - Русский
        - Русский с английскими IT-терминами
        - English
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения
      description: Что открыть и что сделать, чтобы получить ошибку?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Скриншот, логи или минимальный пример без секретов
